
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Kelly Harvey Staging Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #faf9f6;
      color: #222;
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h2 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    button, input, select, textarea {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      box-sizing: border-box;
      margin-top: 8px;
      border-radius: 6px;
    }

    button {
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input, select, textarea {
      border: 1px solid #ccc;
      background: white;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    .notice {
      background: #eeeae3;
      padding: 12px;
      border-radius: 6px;
      margin-top: 18px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h2>Kelly Harvey Staging</h2>
  <p>Barcode Inventory Scanner</p>

  <button id="scanButton" onclick="startScanner()">
    Scan Barcode
  </button>

  <button id="stopButton" onclick="stopScanner()"
          style="display:none">
    Stop Camera
  </button>

  <div id="reader"></div>

  <label for="itemId">Item ID</label>
  <input id="itemId"
         placeholder="CHR-001"
         autocomplete="off">

  <label for="action">Action</label>
  <select id="action">
    <option value="Check Out">Check Out</option>
    <option value="Check In">Check In</option>
  </select>

  <label for="location">Property / Storage Location</label>
  <input id="location"
         placeholder="Property address or Storage">

  <label for="scannedBy">Scanned By</label>
  <input id="scannedBy"
         placeholder="Your name">

  <label for="notes">Notes (optional)</label>
  <textarea id="notes" rows="2"></textarea>

  <button id="saveButton" disabled>
    Save Movement (Connection Pending)
  </button>

  <div class="notice">
    Barcode scanning is available.
    Saving to Google Sheets will be enabled
    after the secure connection is configured.
  </div>

  <p id="message" role="status"
     aria-live="polite"></p>

  <script>
    let scanner = null;
    let scanning = false;

    const message = document.getElementById("message");
    const scanButton = document.getElementById("scanButton");
    const stopButton = document.getElementById("stopButton");

    function showMessage(text) {
      message.textContent = text;
    }

    async function startScanner() {
      if (scanning) return;

      scanButton.disabled = true;
      showMessage("Opening camera...");

      try {
        if (typeof Html5Qrcode === "undefined") {
          throw new Error("Scanner library did not load.");
        }

        scanner = new Html5Qrcode("reader", {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128
          ],
          verbose: false
        });

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: function(viewWidth, viewHeight) {
              return {
                width: Math.floor(viewWidth * 0.9),
                height: Math.min(
                  Math.floor(viewHeight * 0.5),
                  180
                )
              };
            },
            aspectRatio: 1.777778
          },
          async function(decodedText) {
            if (!scanning) return;

            const code = decodedText.trim().toUpperCase();

            document.getElementById("itemId").value = code;
            showMessage("Scanned successfully: " + code);

            await stopScanner(true);
          },
          function() {}
        );

        scanning = true;
        stopButton.style.display = "block";
        showMessage("Point camera at your barcode.");

      } catch (error) {
        showMessage("Camera error: " + String(error));
        scanButton.disabled = false;
        scanning = false;
      }
    }

    async function stopScanner(keepMessage = false) {
      try {
        if (scanner && scanning) {
          await scanner.stop();
        }

        if (scanner) {
          scanner.clear();
        }
      } catch (error) {
        console.log(error);
      }

      scanner = null;
      scanning = false;
      scanButton.disabled = false;
      stopButton.style.display = "none";

      if (!keepMessage) {
        showMessage("Camera stopped.");
      }
    }
  </script>
</body>
</html>
